<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="락카 입실 현황을 실시간으로 관리합니다." />
    <meta name="theme-color" content="#0F172A" />
    <link rel="icon" type="image/png" href="/favicon.png?v=equus1" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=equus1" />
    <title>입실관리매니저</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ivansauna-theme");
          if (t === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#0F172A");
          } else {
            document.documentElement.style.colorScheme = "light";
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        // 라이선스 활성화 시 서버가 내려준 매장 프로필을 React 마운트 전에 반영 —
        // 새로고침할 때마다 일반 브랜딩이 잠깐 보였다가 바뀌는 깜빡임을 막는다.
        try {
          var raw = localStorage.getItem("store_profile_cache_v1");
          if (!raw) return;
          var p = JSON.parse(raw);
          if (!p || !p.storeId) return;
          if (p.displayName) document.title = p.displayName;
          var d = document.querySelector('meta[name="description"]');
          if (d && p.description) d.setAttribute("content", p.description);
          var manifestLink = document.querySelector('link[rel="manifest"]');
          if (manifestLink) {
            manifestLink.href = "/store/" + encodeURIComponent(p.storeId) + "/manifest.webmanifest";
          }
          var iconLink = document.querySelector('link[rel="icon"]');
          if (iconLink && p.icons && p.icons.favicon) {
            iconLink.href = "/store/" + encodeURIComponent(p.storeId) + "/icon/favicon?v=" + encodeURIComponent(p.iconVersion);
          }
          var appleLink = document.querySelector('link[rel="apple-touch-icon"]');
          if (appleLink && p.icons && p.icons.icon192) {
            appleLink.href = "/store/" + encodeURIComponent(p.storeId) + "/icon/icon-192?v=" + encodeURIComponent(p.iconVersion);
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- 모라유리 굴절용 SVG 필터 (backdrop-filter url()은 Chrome 백지 버그 → filter용으로만 사용) -->
    <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" focusable="false">
      <defs>
        <filter id="glass-distortion" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.48"
            numOctaves="3"
            result="noise"
          />
          <feDisplacementMap
            in="SourceGraphic"
            in2="noise"
            scale="18"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
