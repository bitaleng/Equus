<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>라이센스 생성기 - 관리자용</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #e0e0e0;
    }
    .container {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 40px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 24px; font-weight: 600; color: #fff; margin-bottom: 6px; }
    .header p { color: #a0a0a0; font-size: 14px; }
    .warning {
      background: rgba(255,193,7,0.1);
      border: 1px solid rgba(255,193,7,0.3);
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #ffc107;
    }

    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; color: #c0c0c0; }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: #4a9eff;
      box-shadow: 0 0 0 3px rgba(74,158,255,0.2);
    }
    .form-group input::placeholder { color: #707070; }
    .hint { font-size: 12px; color: #808080; margin-top: 6px; }
    .prefix-preview {
      display: inline-block;
      font-family: 'Monaco', 'Menlo', monospace;
      background: rgba(74,158,255,0.15);
      color: #4a9eff;
      border-radius: 4px;
      padding: 2px 8px;
      margin-top: 6px;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .btn {
      width: 100%;
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: linear-gradient(135deg, #4a9eff 0%, #3b82f6 100%); color: #fff; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(74,158,255,0.4); }
    .btn-primary:active { transform: translateY(0); }

    .result-section { margin-top: 30px; display: none; }
    .result-section.show { display: block; }
    .result-section h3 { font-size: 16px; margin-bottom: 12px; color: #4ade80; }
    .license-key {
      background: rgba(74,222,128,0.1);
      border: 1px solid rgba(74,222,128,0.3);
      border-radius: 8px;
      padding: 16px;
      font-family: 'Monaco', 'Menlo', monospace;
      font-size: 20px;
      text-align: center;
      letter-spacing: 2px;
      color: #4ade80;
      margin-bottom: 12px;
    }
    .license-info {
      background: rgba(255,255,255,0.05);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      color: #a0a0a0;
    }
    .license-info div { margin-bottom: 4px; }
    .license-info div:last-child { margin-bottom: 0; }

    .btn-copy {
      margin-top: 12px;
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .btn-copy:hover { background: rgba(255,255,255,0.2); }
    .btn-copy.copied { background: rgba(74,222,128,0.2); border-color: rgba(74,222,128,0.4); color: #4ade80; }

    .history-section {
      margin-top: 40px;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 30px;
    }
    .history-section h3 { font-size: 16px; margin-bottom: 16px; color: #c0c0c0; }
    .history-list { max-height: 200px; overflow-y: auto; }
    .history-item {
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-item .key { font-family: 'Monaco','Menlo',monospace; color: #4a9eff; }
    .history-item .info { color: #808080; font-size: 11px; }
    .empty-history { color: #606060; text-align: center; padding: 20px; font-size: 14px; }
    .btn-clear {
      background: transparent;
      border: 1px solid rgba(239,68,68,0.5);
      color: #ef4444;
      font-size: 12px;
      padding: 6px 12px;
      margin-top: 12px;
    }
    .btn-clear:hover { background: rgba(239,68,68,0.1); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>라이센스 생성기</h1>
      <p>입실관리 시스템 관리자 전용</p>
    </div>

    <div class="warning">
      이 파일은 관리자 전용입니다. 고객에게 절대 공유하지 마세요.
      안전한 장소에 보관하고 필요할 때만 사용하세요.
    </div>

    <form id="licenseForm">
      <div class="form-group">
        <label for="customerCode">매장 이름 (영문/숫자로 입력 권장)</label>
        <input type="text" id="customerCode" placeholder="예: Shelter Gangnam" required />
        <div class="hint">
          라이선스 키 맨 앞 4글자에 그대로 쓰입니다. 이 텍스트는
          <b>store-admin.html에서 라이선스를 매장에 연결할 때 토씨 하나 틀리지 않고 똑같이</b> 입력해야 합니다.
        </div>
        <div class="prefix-preview" id="prefixPreview">키 앞부분: ----</div>
      </div>
      <div class="form-group">
        <label for="expiryDate">만료일</label>
        <input type="date" id="expiryDate" required />
      </div>
      <button type="submit" class="btn btn-primary" id="generateBtn">
        라이센스 생성
      </button>
    </form>

    <div class="result-section" id="resultSection">
      <h3>생성된 라이센스</h3>
      <div class="license-key" id="licenseKey"></div>
      <div class="license-info" id="licenseInfo"></div>
      <button class="btn btn-copy" id="copyBtn" onclick="copyLicense()">클립보드에 복사</button>
    </div>

    <div class="history-section">
      <h3>생성 기록</h3>
      <div class="history-list" id="historyList">
        <div class="empty-history">아직 생성된 라이센스가 없습니다</div>
      </div>
      <button class="btn btn-clear" id="clearHistoryBtn" style="display:none;" onclick="clearHistory()">기록 삭제</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <script>
    // ── 서명용 비밀키 (netlify/functions/license-bind.ts와 반드시 동일해야 함) ──
    const SECRET = (function() {
      const p = [
        String.fromCharCode(76,111,99,107),
        "2026!",
        String.fromCharCode(77,103,114,83,118),
        "#IvSn@",
        String.fromCharCode(85,110,105,51,116)
      ];
      return p.join('');
    })();

    const HISTORY_KEY = 'license_generator_history_v2';

    function generateSignature(data) {
      const hash = CryptoJS.HmacSHA256(data, SECRET);
      return hash.toString(CryptoJS.enc.Hex).substring(0, 8).toUpperCase();
    }

    function encodeDate(date) {
      const year = date.getFullYear() - 2020;
      const month = date.getMonth() + 1;
      const day = date.getDate();
      const encoded = (year * 10000) + (month * 100) + day;
      return encoded.toString(36).toUpperCase().padStart(4, '0');
    }

    function encodeCustomerCode(code) {
      let hash = 0;
      for (let i = 0; i < code.length; i++) {
        const char = code.charCodeAt(i);
        hash = ((hash << 5) - hash) + char;
        hash = hash & hash;
      }
      return Math.abs(hash).toString(36).toUpperCase().padStart(4,'0').substring(0,4);
    }

    // 매장 이름 앞 4글자(영문/숫자만) → 라이선스 키 첫 부분. 사람이 보고 읽는 용도일 뿐
    // 서명 검증에는 쓰이지 않는다. 짧으면 X로 채우고, 길면 뒤를 자른다.
    function deriveKeyPrefix(name) {
      const cleaned = name.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
      const truncated = cleaned.slice(0, 4);
      return (truncated + 'XXXX').slice(0, 4);
    }

    function generateLicenseKey(storeName, expiryDate) {
      const prefix = deriveKeyPrefix(storeName);
      const encodedCustomer = encodeCustomerCode(storeName);
      const encodedDate = encodeDate(expiryDate);
      const dataPayload = encodedCustomer + encodedDate;
      const signature = generateSignature(dataPayload);
      return prefix + "-" + encodedCustomer + "-" + encodedDate + "-" + signature.substring(0, 4);
    }

    function getHistory() {
      const stored = localStorage.getItem(HISTORY_KEY);
      return stored ? JSON.parse(stored) : [];
    }

    function saveHistory(entry) {
      const history = getHistory();
      history.unshift(entry);
      if (history.length > 50) history.pop();
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
      renderHistory();
    }

    function clearHistory() {
      localStorage.removeItem(HISTORY_KEY);
      renderHistory();
    }

    function renderHistory() {
      const history = getHistory();
      const container = document.getElementById('historyList');
      const clearBtn = document.getElementById('clearHistoryBtn');
      if (history.length === 0) {
        container.innerHTML = '<div class="empty-history">아직 생성된 라이센스가 없습니다</div>';
        clearBtn.style.display = 'none';
        return;
      }
      clearBtn.style.display = 'block';
      container.innerHTML = history.map(item => `
        <div class="history-item">
          <div>
            <div class="key">${item.key}</div>
            <div class="info">${item.customer} / 만료: ${item.expiry}</div>
          </div>
          <div class="info">${item.date}</div>
        </div>
      `).join('');
    }

    function copyLicense() {
      const key = document.getElementById('licenseKey').textContent;
      navigator.clipboard.writeText(key).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = '복사됨!';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = '클립보드에 복사';
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    document.getElementById('customerCode').addEventListener('input', (e) => {
      const preview = document.getElementById('prefixPreview');
      const value = e.target.value.trim();
      preview.textContent = '키 앞부분: ' + (value ? deriveKeyPrefix(value) : '----');
    });

    document.getElementById('licenseForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const customerCode = document.getElementById('customerCode').value.trim();
      const expiryDateStr = document.getElementById('expiryDate').value;
      if (!customerCode || !expiryDateStr) { alert('모든 필드를 입력해주세요.'); return; }
      const expiryDate = new Date(expiryDateStr);
      const today = new Date();
      today.setHours(0,0,0,0);
      if (expiryDate < today) { alert('만료일은 오늘 이후로 설정해주세요.'); return; }

      const licenseKey = generateLicenseKey(customerCode, expiryDate);
      document.getElementById('licenseKey').textContent = licenseKey;
      document.getElementById('licenseInfo').innerHTML = `
        <div><strong>매장 이름:</strong> ${customerCode}</div>
        <div><strong>만료일:</strong> ${expiryDate.toLocaleDateString('ko-KR')}</div>
        <div><strong>생성일:</strong> ${new Date().toLocaleDateString('ko-KR')}</div>
      `;
      document.getElementById('resultSection').classList.add('show');
      saveHistory({
        key: licenseKey,
        customer: customerCode,
        expiry: expiryDate.toLocaleDateString('ko-KR'),
        date: new Date().toLocaleDateString('ko-KR')
      });
    });

    const today = new Date();
    const nextYear = new Date(today.getFullYear() + 1, today.getMonth(), today.getDate());
    document.getElementById('expiryDate').value = nextYear.toISOString().split('T')[0];
    document.getElementById('expiryDate').min = today.toISOString().split('T')[0];
    renderHistory();
  </script>
</body>
</html>
