<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="락카 입실 현황을 실시간으로 관리합니다." />
    <meta name="theme-color" content="#0F172A" />
    <link rel="icon" type="image/png" href="/favicon.png?v=equus1" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=equus1" />
    <title>휴게텔 입실관리매니저</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/assets/index-BB1gzv3G.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CbnNSe_y.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Register Service Worker for offline support + auto-update detection
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // 첫 등록 여부 확인: 이미 컨트롤러가 있으면 업데이트 감지 가능
          const hadController = !!navigator.serviceWorker.controller;

          // 컨트롤러가 바뀌면 (= 새 SW가 활성화됐으면) 업데이트 배너 표시
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (hadController) {
              window.dispatchEvent(new Event('swUpdated'));
            }
          });

          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('Service Worker registered:', registration.scope);
            })
            .catch((error) => {
              console.log('Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
