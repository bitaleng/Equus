# Server-side CCTV installation notification relay
[functions]
  directory = "netlify/functions"

# Keep the private recipient URL on Netlify, not in the PWA bundle
[[redirects]]
  from = "/api/cctv/register"
  to = "/.netlify/functions/cctv-register"
  status = 200

# Demo trial: fingerprint-based start date / extension (survives site data clear)
[[redirects]]
  from = "/api/demo/trial"
  to = "/.netlify/functions/demo-trial"
  status = 200

# Official license: 1-device binding
[[redirects]]
  from = "/api/license/bind"
  to = "/.netlify/functions/license-bind"
  status = 200

# License generator - serve as static file (before SPA redirect)
[[redirects]]
  from = "/license-generator.html"
  to = "/license-generator.html"
  status = 200

# SPA routing - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# HTML files - no cache to always get latest version
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service Worker - prevent caching to ensure updates work properly
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Web App Manifest - correct MIME type
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# SQLite WASM files - long cache (immutable)
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

# Static assets - long cache with cache busting via filename hash
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts - long cache
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
