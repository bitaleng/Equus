# 라우팅(리다이렉트)과 캐시 헤더는 각각 _redirects, _headers 파일에서만 관리한다.
# 예전엔 이 파일에도 [[redirects]]/[[headers]]를 똑같이 중복 정의해뒀는데,
# Netlify Drop 배포에서 이 파일과 _redirects가 동시에 존재할 때 어느 쪽이 실제로
# 적용되는지 애매해지면서(둘 다 동일 내용인데도) 플레이스홀더(:storeId 등)가 쿼리스트링으로
# 제대로 안 넘어가는 문제가 있었음 — 규칙을 두 곳에 두지 말고 한 곳(_redirects/_headers)에만
# 두도록 정리. 이 파일은 함수 위치 지정 용도로만 남긴다.
[functions]
  directory = "netlify/functions"
