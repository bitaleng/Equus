[build]
  command   = "npx vite build"
  publish   = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/cctv/register"
  to = "/.netlify/functions/cctv-register"
  status = 200

[[redirects]]
  from = "/api/demo/trial"
  to = "/.netlify/functions/demo-trial"
  status = 200

[[redirects]]
  from = "/api/license/bind"
  to = "/.netlify/functions/license-bind"
  status = 200

[[redirects]]
  from = "/api/store/admin"
  to = "/.netlify/functions/store-profile-admin"
  status = 200

[[redirects]]
  from = "/store/:storeId/manifest.webmanifest"
  to = "/.netlify/functions/store-manifest?store=:storeId"
  status = 200

[[redirects]]
  from = "/store/:storeId/icon/:variant"
  to = "/.netlify/functions/store-icon?store=:storeId&variant=:variant"
  status = 200

[[redirects]]
  from = "/license-generator.html"
  to = "/license-generator.html"
  status = 200

[[redirects]]
  from = "/store-admin.html"
  to = "/store-admin.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
