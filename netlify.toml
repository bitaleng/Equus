[build]
  command   = "npx vite build"
  publish   = "dist/public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/cctv/register"
  to = "/.netlify/functions/cctv-register"
  status = 200

[[redirects]]
  from = "/api/demo/trial"
  to = "/.netlify/functions/demo-trial"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
