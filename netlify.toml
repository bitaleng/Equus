[build]
  command = "vite build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"
  VITE_SKIN = "v2"
  VITE_APP_NAME = "He's 입실관리매니저"
  VITE_APP_SHORT_NAME = "He's"
  VITE_APP_DESCRIPTION = "라이선스 키를 입력하여 시스템을 활성화하세요."
  VITE_LICENSE_STORAGE_KEY = "rest_hotel_license_v2"

# License generator - serve as static file (before SPA redirect)
[[redirects]]
  from = "/license-generator.html"
  to = "/license-generator.html"
  status = 200

# SPA routing - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# HTML files - no cache to always get latest version
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service Worker - prevent caching to ensure updates work properly
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Web App Manifest - correct MIME type
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# SQLite WASM files - long cache (immutable)
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

# Static assets - long cache with cache busting via filename hash
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fonts - long cache
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
