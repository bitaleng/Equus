<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>체험판 시작·연장 코드 생성기</title>
  <style>
    *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:#111827;color:#f9fafb;font-family:system-ui,sans-serif;padding:20px}
    main{width:min(520px,100%);background:#1f2937;border:1px solid #374151;border-radius:16px;padding:28px;box-shadow:0 20px 50px #0006}
    h1{font-size:22px;margin:0 0 8px} p{color:#9ca3af;font-size:14px;line-height:1.5} label{display:block;margin:18px 0 6px;font-size:14px}
    input,button{width:100%;border-radius:8px;border:1px solid #4b5563;padding:12px;background:#111827;color:#fff;font-size:16px}
    button{margin-top:20px;background:#2563eb;border:0;font-weight:700;cursor:pointer} button.secondary{background:#374151;margin-top:10px}
    #result{display:none;margin-top:20px;padding:16px;border-radius:8px;background:#052e16;border:1px solid #166534;text-align:center}
    #code{font:700 19px ui-monospace,monospace;color:#86efac;letter-spacing:1px;word-break:break-all}
    .warning{color:#fbbf24;background:#422006;padding:10px;border-radius:8px;margin:12px 0}
    .hint{font-size:12px;color:#9ca3af;margin-top:6px}
    .tabs{display:flex;gap:8px;margin-top:16px}
    .tabs button{margin:0;flex:1;background:#374151}
    .tabs button.active{background:#2563eb}
  </style>
</head>
<body>
  <main>
    <h1>체험판 시작·연장 코드 생성기</h1>
    <p class="warning">관리자 전용 파일입니다. 사용자에게 이 파일을 보내지 마세요.</p>
    <p>통합 체험판(demo) 전용입니다. 다른 PC/태블릿에서는 자동으로 새 체험이 시작되지 않습니다. 기기마다 <b>시작 코드</b>가 필요합니다.</p>

    <div class="tabs">
      <button type="button" id="tab-start" class="active">시작 코드</button>
      <button type="button" id="tab-extend">연장 코드</button>
    </div>

    <label for="deviceId">사용자가 보내준 체험 기기 ID</label>
    <input id="deviceId" maxlength="12" placeholder="예: 1A2B3C4D5E6F" autocomplete="off" />

    <label for="days" id="days-label">체험 일수 (기본 10일)</label>
    <input id="days" type="number" min="10" max="30" value="10" />
    <p class="hint" id="days-hint">시작: 10~30일 / 연장: 최초 시작일 기준 총 11~30일</p>

    <button id="generate">코드 생성</button>

    <div id="result">
      <div id="code"></div>
      <button id="copy" class="secondary">코드 복사</button>
    </div>
  </main>
  <script>
    const DEMO_SKIN = "demo";
    const secret = "IvDemo-Extend-2026!Unified";
    const DEFAULT_DAYS = 10;

    let mode = "start";

    function setMode(next) {
      mode = next;
      document.getElementById("tab-start").classList.toggle("active", mode === "start");
      document.getElementById("tab-extend").classList.toggle("active", mode === "extend");
      const days = document.getElementById("days");
      const label = document.getElementById("days-label");
      if (mode === "start") {
        label.textContent = "체험 일수 (기본 10일)";
        days.min = DEFAULT_DAYS; days.max = 30; days.value = DEFAULT_DAYS;
      } else {
        label.textContent = "최초 체험 시작일부터 총 사용일";
        days.min = DEFAULT_DAYS + 1; days.max = 30; days.value = 30;
      }
      document.getElementById("result").style.display = "none";
    }

    document.getElementById("tab-start").addEventListener("click", () => setMode("start"));
    document.getElementById("tab-extend").addEventListener("click", () => setMode("extend"));

    async function signature(payload) {
      const encoder = new TextEncoder();
      const key = await crypto.subtle.importKey(
        "raw", encoder.encode(secret), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]
      );
      const bytes = new Uint8Array(
        await crypto.subtle.sign("HMAC", key, encoder.encode(payload))
      );
      return Array.from(bytes, b => b.toString(16).padStart(2, "0"))
        .join("").substring(0, 10).toUpperCase();
    }

    document.getElementById("generate").addEventListener("click", async () => {
      const deviceId = document.getElementById("deviceId").value
        .replace(/[^a-f0-9]/gi, "").toUpperCase();
      const days = Number(document.getElementById("days").value);

      if (!/^[A-F0-9]{12}$/.test(deviceId)) {
        alert("체험 기기 ID 12자리를 정확히 입력하세요.");
        return;
      }

      if (mode === "start") {
        if (!Number.isInteger(days) || days < DEFAULT_DAYS || days > 30) {
          alert(`시작 체험 일수는 ${DEFAULT_DAYS}일부터 30일 사이여야 합니다.`);
          return;
        }
        const sig = await signature(`${DEMO_SKIN}|${deviceId}|START|${days}`);
        const code = `START-${String(days).padStart(2, "0")}-${sig}`;
        document.getElementById("code").textContent = code;
      } else {
        if (!Number.isInteger(days) || days < DEFAULT_DAYS + 1 || days > 30) {
          alert(`총 사용일은 ${DEFAULT_DAYS + 1}일부터 30일 사이여야 합니다.`);
          return;
        }
        const sig = await signature(`${DEMO_SKIN}|${deviceId}|${days}`);
        const code = `DEMO-${String(days).padStart(2, "0")}-${sig}`;
        document.getElementById("code").textContent = code;
      }
      document.getElementById("result").style.display = "block";
    });

    document.getElementById("copy").addEventListener("click", async () => {
      await navigator.clipboard.writeText(document.getElementById("code").textContent);
      document.getElementById("copy").textContent = "복사 완료";
      setTimeout(() => document.getElementById("copy").textContent = "코드 복사", 1500);
    });
  </script>
</body>
</html>
